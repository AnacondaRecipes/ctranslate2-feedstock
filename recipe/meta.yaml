{% set name = "ctranslate2" %}
{% set version = "4.8.5" %}
{% set build_number = 0 %}

package:
  name: {{ name }}-meta
  version: {{ version }}

source:
  - url: https://github.com/OpenNMT/CTranslate2/archive/refs/tags/v{{ version }}.tar.gz
    sha256: 07d2dc455b259c29702dc4fbdfd26fb763179dc3fb4a0fc4a4d88fdfb13305d3
    patches:
      - patches/mkl-shared-libs.patch      # [linux]
      - patches/mkl-dll-libs-win.patch     # [win]
      - patches/use-system-thrust.patch    # [(gpu_variant or "").startswith("cuda")]
      - patches/cuda13-compat.patch         # [(gpu_variant or "").startswith("cuda")]
  - url: https://github.com/gabime/spdlog/archive/v1.14.1.tar.gz
    sha256: 1586508029a7d0670dfcb2d97575dcdc242d3868a259742b69f100801ab4e16b
    folder: third_party/spdlog
  - url: https://github.com/google/cpu_features/archive/v0.9.0.tar.gz
    sha256: bdb3484de8297c49b59955c3b22dba834401bc2df984ef5cfc17acbe69c5018e
    folder: third_party/cpu_features

build:
  number: {{ build_number }}

outputs:
  - name: libctranslate2
    script: build-libctranslate2.sh   # [not win]
    script: bld-libctranslate2.bat    # [win]
    version: {{ version }}

    build:
      # do not mix cublas and mkl/openblas/accelerate
      skip: true  # [((gpu_variant or "").startswith("cuda") and (blas_impl != "cublas")) or (not (gpu_variant or "").startswith("cuda") and (blas_impl == "cublas"))]
      # upstream ships no win-arm64 build (no wheel, no CI); mkl is absent there and CUDA has no CI GPU worker
      skip: true  # [win and arm64]
      # GPU variant gets build_number + 100 for solver preference
      number: {{ build_number + 100 }}  # [gpu_variant != "none"]
      number: {{ build_number }}        # [gpu_variant == "none"]
      string: cuda{{ cuda_compiler_version | replace('.', '') }}_h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}  # [(gpu_variant or "").startswith("cuda")]
      string: cpu_{{ blas_impl }}_h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}                                 # [gpu_variant == "none"]
      missing_dso_whitelist:                        # [(gpu_variant or "").startswith("cuda")]
        - "**/libcuda.so*"                          # [(gpu_variant or "").startswith("cuda")]
        - "**/nvcuda.dll"                           # [(gpu_variant or "").startswith("cuda")]
      ignore_run_exports:                           # [(gpu_variant or "").startswith("cuda") or blas_impl == "mkl"]
        # only curand_kernel.h (device API) is used; no libcurand DSO is linked or loaded
        - libcurand                                 # [(gpu_variant or "").startswith("cuda")]
        # mkl-devel exports the Python mkl-service module; the C++ library never imports it
        - mkl-service                               # [blas_impl == "mkl"]
      # Hand-written instead of pin_subpackage(exact=True): with a custom PKG_HASH string,
      # conda-build <26.9.0 (PBP workers) exports the placeholder h1234567 (conda/conda-build#6100).
      run_exports:
        - libctranslate2 {{ version }} cuda{{ cuda_compiler_version | replace('.', '') }}_*  # [(gpu_variant or "").startswith("cuda")]
        - libctranslate2 {{ version }} cpu_{{ blas_impl }}_*                                 # [gpu_variant == "none"]

    requirements:
      build:
        - {{ stdlib('c') }}
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - {{ compiler('cuda') }}                              # [(gpu_variant or "").startswith("cuda")]
        - cmake
        - ninja-base
      host:
        - cuda-cudart-dev {{ cuda_compiler_version }}  # [(gpu_variant or "").startswith("cuda")]
        - libcublas-dev                                # [(gpu_variant or "").startswith("cuda")] analint: host_section_needs_exact_pinnings  # cuda-cudart-dev above pins cuda-version
        - libcurand-dev                                # [(gpu_variant or "").startswith("cuda")] analint: host_section_needs_exact_pinnings  # cuda-cudart-dev above pins cuda-version
        - cudnn                                        # [(gpu_variant or "").startswith("cuda")] analint: host_section_needs_exact_pinnings  # no cudnn key in the aggregate CBC
        - cuda-compat {{ cuda_compiler_version }}      # [(gpu_variant or "").startswith("cuda") and linux]
        - mkl-devel {{ mkl }}                          # [blas_impl == "mkl"]
        - intel-openmp {{ mkl }}                       # [blas_impl == "mkl"]
        - openblas-devel {{ openblas }}                # [blas_impl == "openblas"]
        - llvm-openmp {{ cxx_compiler_version }}       # [osx]
        - libgomp                                      # [linux and blas_impl != "mkl"] analint: host_section_needs_exact_pinnings  # OpenMP runtime of the gcc toolchain
        - vcomp14 {{ vcomp14 }}                        # [(win and x86_64) and not (blas_impl == "mkl")] analint: host_section_needs_exact_pinnings  # aggregate CBC pins vcomp14; the linter's bundled CBC lacks it
        # Unvendored: the bundled include/nlohmann (3.11.2) is deleted in the build script.
        # 3.12.0 (not upstream's 3.11.2) so libctranslate2 co-installs with libmamba (nlohmann_json 3.12.0.*).
        - nlohmann_json 3.12.0
      run:
        - __cuda                                                # [(gpu_variant or "").startswith("cuda")]
        - {{ pin_compatible('intel-openmp') }}                  # [blas_impl == "mkl"]
        - libgomp                                               # [linux and blas_impl != "mkl"]
        - llvm-openmp                                           # [osx]
        - vcomp14                                               # [(win and x86_64) and not (blas_impl == "mkl")]
        # public header models/model.h embeds nlohmann::json, whose inline ABI namespace carries x.y.z
        - {{ pin_compatible('nlohmann_json', max_pin='x.x.x') }}

    test:
      commands:
        - test -f $PREFIX/lib/libctranslate2${SHLIB_EXT}      # [unix]
        - test -f $PREFIX/include/ctranslate2/translator.h    # [unix]
        - if not exist %PREFIX%\Library\bin\ctranslate2.dll exit 1        # [win]
        - if not exist %PREFIX%\Library\include\ctranslate2\translator.h exit 1  # [win]

    about:
      home: https://github.com/OpenNMT/CTranslate2
      summary: C++ library for efficient inference with Transformer models
      description: |
        Shared library and C++ headers of CTranslate2, a runtime for efficient inference with
        Transformer models that applies weights quantization, layer fusion and batch reordering
        to accelerate and reduce the memory usage of models on CPU and GPU.
      # Bundled: header-only spdlog (MIT) everywhere. x86_64: static cpu_features (Apache-2.0) and the
      # AVX/AVX512 kernels' avx_mathfun.h (MIT, zlib origin) and avx512_mathfun.h (BSD-2, no copyright line upstream).
      # arm64: the NEON kernels' neon_mathfun.h (zlib).
      license: MIT AND Apache-2.0 AND BSD-2-Clause AND Zlib  # [x86_64]
      license: MIT AND Zlib                                   # [not x86_64]
      license_family: Other
      license_file:
        - LICENSE
        - third_party/spdlog/LICENSE
        - third_party/cpu_features/LICENSE  # [x86_64]
        - third_party/avx_mathfun.h         # [x86_64]
        - third_party/avx512_mathfun.h      # [x86_64]
        - third_party/neon_mathfun.h        # [not x86_64]
      dev_url: https://github.com/OpenNMT/CTranslate2
      doc_url: https://opennmt.net/CTranslate2

  - name: ctranslate2
    script: build-ctranslate2.sh   # [not win]
    script: bld-ctranslate2.bat    # [win]
    version: {{ version }}

    build:
      # Match skip logic from libctranslate2
      skip: true  # [((gpu_variant or "").startswith("cuda") and (blas_impl != "cublas")) or (not (gpu_variant or "").startswith("cuda") and (blas_impl == "cublas"))]
      skip: true  # [py<39]
      skip: true  # [win and arm64]
      number: {{ build_number + 100 }}  # [gpu_variant != "none"]
      number: {{ build_number }}        # [gpu_variant == "none"]
      string: cuda{{ cuda_compiler_version | replace('.', '') }}_py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}  # [(gpu_variant or "").startswith("cuda")]
      string: cpu_{{ blas_impl }}_py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}                                 # [gpu_variant == "none"]
      missing_dso_whitelist:                        # [(gpu_variant or "").startswith("cuda")]
        - "**/libcuda.so*"                          # [(gpu_variant or "").startswith("cuda")]
        - "**/nvcuda.dll"                           # [(gpu_variant or "").startswith("cuda")]
      entry_points:
        - ct2-fairseq-converter = ctranslate2.converters.fairseq:main
        - ct2-marian-converter = ctranslate2.converters.marian:main
        - ct2-openai-gpt2-converter = ctranslate2.converters.openai_gpt2:main
        - ct2-opennmt-py-converter = ctranslate2.converters.opennmt_py:main
        - ct2-opennmt-tf-converter = ctranslate2.converters.opennmt_tf:main
        - ct2-opus-mt-converter = ctranslate2.converters.opus_mt:main
        - ct2-transformers-converter = ctranslate2.converters.transformers:main

    requirements:
      build:
        - {{ stdlib('c') }}
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
      host:
        - python
        - pip
        - setuptools
        - wheel
        # python/pyproject.toml [build-system]: pybind11==2.13.6
        - pybind11 2.13.6
        - pybind11-abi
        # the extension includes ctranslate2/models/model.h, which includes <nlohmann/json.hpp>
        - nlohmann_json 3.12.0
        - {{ pin_subpackage('libctranslate2', exact=True) }}
      run:
        - python
        - numpy
        - pyyaml >=5.3,<7
        - {{ pin_subpackage('libctranslate2', exact=True) }}

    test:
      imports:
        - ctranslate2
        # `import ctranslate2` silently tolerates a missing extension; import it explicitly
        - ctranslate2._ext
      commands:
        - pip check
        - python -c "import ctranslate2; print(ctranslate2.get_supported_compute_types('cpu'))"
        # CUDA test workers have a GPU: require one and launch a kernel (float32<->float16 convert) so a
        # missing SASS/PTX target for the worker's architecture fails here instead of passing silently
        - python -c "import numpy as np, ctranslate2 as c; assert c.get_cuda_device_count() > 0, 'no CUDA device'; print(c.get_supported_compute_types('cuda')); x = c.StorageView.from_array(np.arange(8, dtype=np.float32)).to_device(c.Device.cuda); y = x.to(c.DataType.float16).to(c.DataType.float32).to_device(c.Device.cpu); assert np.array_equal(np.asarray(y), np.arange(8, dtype=np.float32))"  # [(gpu_variant or "").startswith("cuda")]
        - python -c "from ctranslate2.converters import fairseq, marian, openai_gpt2, opennmt_py, opennmt_tf, opus_mt, transformers"
        # the .exe launchers fail silently on Windows; the module imports above cover it there
        - ct2-fairseq-converter --help        # [not win]
        - ct2-marian-converter --help         # [not win]
        - ct2-openai-gpt2-converter --help    # [not win]
        - ct2-opennmt-py-converter --help     # [not win]
        - ct2-opennmt-tf-converter --help     # [not win]
        - ct2-opus-mt-converter --help        # [not win]
        - ct2-transformers-converter --help   # [not win]
      requires:
        - pip

    about:
      home: https://github.com/OpenNMT/CTranslate2
      summary: Python bindings for CTranslate2 - fast Transformer inference
      description: |
        Python bindings for CTranslate2, a runtime for efficient inference with Transformer
        models, plus converters (ct2-*-converter) from OpenNMT, Fairseq, Marian, OPUS-MT and
        Hugging Face Transformers checkpoints.
      license: MIT
      license_family: MIT
      license_file: LICENSE
      dev_url: https://github.com/OpenNMT/CTranslate2
      doc_url: https://opennmt.net/CTranslate2

about:
  home: https://github.com/OpenNMT/CTranslate2
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Fast inference engine for Transformer models
  description: |
    CTranslate2 is a C++ and Python library for efficient inference with Transformer models.
    It implements a custom runtime that applies many performance optimization techniques such
    as weights quantization, layer fusion, batch reordering, etc., to accelerate and reduce
    the memory usage of Transformer models on CPU and GPU.
  dev_url: https://github.com/OpenNMT/CTranslate2
  doc_url: https://opennmt.net/CTranslate2

extra:
  recipe-maintainers:
    - xkong-anaconda
